services:
  web:
    build: .
    container_name: xgboost-web
    command: gunicorn xgbTree.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: xgboost-db
    environment:
      POSTGRES_DB: xgboostModel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  test:
    build: .
    container_name: xgboost-test
    command: python -m pytest -v
    depends_on:
      - db
    env_file:
      - .env


volumes:
  postgres_data:
